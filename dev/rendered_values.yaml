services:
  backend:
    image:
      repository: ghcr.io/ludat/banana-split
      tag: 20261119-051402@sha256:700837c9ad64272a783f40ccb8f748c51c18ae00e38dd65e594ecff4936ef9bf
      source:
        type: lexical
        pattern: '^\d{8}-\d{6}$'
    env:
      REPARTIX_DATABASE_URL:
        fromDependency: pg.uri

    port: 8000
    secrets:
      - config
    dependencies: [pg]
    routes:
      - host: dev.split.ludat.io

dependencies:
  pg:
    type: postgres

hooks:
  pre-deploy:
    - name: migrations
      service: backend
      command:
        - sh
        - -c
        - |
            timeout 10 repartix migrations init
            repartix migrations migrate ./migrations
  post-deploy:
    - name: migrations
      service: backend
      command:
        - sh
        - -c
        - |
            if ! [[ "$(timeout 10 repartix migrations status | grep status | sed 's/^ *"status": "\(.*\)"/\1/')" = "Complete" ]]; then
              repartix migrations complete
            fi
