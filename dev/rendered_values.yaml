services:
  backend:
    image:
      repository: ghcr.io/ludat/banana-split
      tag: 20261118-075410@sha256:8b236505faa495f870281c2d6344488da22b30f95b2eecd238d6ffe4cc5cbab7
      source:
        type: lexical
        pattern: '^\d{8}-\d{6}$'
    env:
      REPARTIX_DATABASE_URL:
        fromDependency: pg.uri
      BANANASPLIT_DATABASE_URL:
        fromDependency: pg.uri

    port: 8000
    secrets:
      - config
    dependencies: [pg]
    routes:
      - host: dev.split.ludat.io

dependencies:
  pg:
    type: postgres

hooks:
  pre-deploy:
    - name: migrations
      service: backend
      command:
        - sh
        - -c
        - |
            timeout 10 banana-split migrations init
            banana-split migrations migrate ./migrations
  post-deploy:
    - name: migrations
      service: backend
      command:
        - sh
        - -c
        - |
            if ! [[ "$(timeout 10 banana-split migrations status | grep status | sed 's/^ *"status": "\(.*\)"/\1/')" = "Complete" ]]; then
              banana-split migrations complete
            fi
