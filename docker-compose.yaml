services:
  app:
    image: banana-split
    ports:
      - "8000:8000"
    depends_on:
      - database
    environment:
      - BANANASPLIT_DATABASE_URL=postgres://postgres:postgres@database/bananasplit_dev
      - BANANASPLIT_LOG_CONSOLE=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://observability:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=backend
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=banana-split,service.version=latest,deployment.environment.name=local
      - OTEL_METRIC_EXPORT_INTERVAL=500
      - OTEL_BSP_SCHEDULE_DELAY=500
      - OTEL_BLRP_SCHEDULE_DELAY_MILLIS=500
    volumes:
      - ./config/dev.properties:/opt/banana-split/config/dev.properties
  observability:
    image: "grafana/otel-lgtm:0.34.0"
    environment:
      - PROMETHEUS_EXTRA_ARGS=--enable-feature=otlp-deltatocumulative
      - ENABLE_LOGS_ALL=true
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    volumes:
      - otel-data:/data
  database:
    image: "postgres:18-alpine"
    restart: always
    environment:
      - POSTGRES_DB=bananasplit_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "log_statement=all"]
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 1s
      retries: 6
      timeout: 10s

volumes:
  db-data:
  otel-data:
