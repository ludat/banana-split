services:
  backend:
    image:
      repository: ghcr.io/ludat/banana-split
      tag: 20261118-052102@sha256:5c35c6d9940d58c6e2df96514ce43a60f4e8a84171bf69fb2b2c735a417152cc
      source:
        type: upstream
        stage: dev
    env:
      REPARTIX_DATABASE_URL:
        fromDependency: db.uri
      BANANASPLIT_DATABASE_URL:
        fromDependency: db.uri

    port: 8000
    secrets:
      - config
    dependencies: [pg]
    routes:
      - host: stg.split.ludat.io

dependencies:
  pg:
    type: postgres

hooks:
  pre-deploy:
    - name: migrations
      service: backend
      command:
        - sh
        - -c
        - |
            timeout 10 banana-split migrations init
            banana-split migrations migrate ./migrations
  post-deploy:
    - name: migrations
      service: backend
      command:
        - sh
        - -c
        - |
            if ! [[ "$(timeout 10 banana-split migrations status | grep status | sed 's/^ *"status": "\(.*\)"/\1/')" = "Complete" ]]; then
              banana-split migrations complete
            fi
