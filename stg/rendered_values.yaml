services:
  backend:
    image:
      repository: ghcr.io/ludat/banana-split
      tag: 20261118-075850@sha256:dc798790b482c181add619e20077cb9a43cbf4f8f4c9a1170ed6f94a9fa1fb4c
      source:
        type: upstream
        stage: dev
    env:
      REPARTIX_DATABASE_URL:
        fromDependency: pg.uri

    port: 8000
    secrets:
      - config
    dependencies: [pg]
    routes:
      - host: stg.split.ludat.io

dependencies:
  pg:
    type: postgres

hooks:
  pre-deploy:
    - name: migrations
      service: backend
      command:
        - sh
        - -c
        - |
            timeout 10 repartix migrations init
            repartix migrations migrate ./migrations
  post-deploy:
    - name: migrations
      service: backend
      command:
        - sh
        - -c
        - |
            if ! [[ "$(timeout 10 repartix migrations status | grep status | sed 's/^ *"status": "\(.*\)"/\1/')" = "Complete" ]]; then
              repartix migrations complete
            fi
