services:
  backend:
    image:
      repository: ghcr.io/ludat/banana-split
      tag: 20261127-030355@sha256:a90843236f311a695ca5b3d6a301dc9314a9d28f35e2b613e2019631c2294437
      source:
        type: upstream
        stage: dev
    env:
      REPARTIX_DATABASE_URL:
        fromDependency: pg.uri

    port: 8000
    secrets:
      - config
    dependencies: [pg]
    routes:
      - host: stg.split.ludat.io

dependencies:
  pg:
    type: postgres

hooks:
  pre-deploy:
    - name: migrations
      service: backend
      command:
        - sh
        - -c
        - |
            timeout 10 repartix migrations init
            repartix migrations migrate ./migrations
  post-deploy:
    - name: migrations
      service: backend
      command:
        - sh
        - -c
        - |
            if ! [[ "$(timeout 10 repartix migrations status | grep status | sed 's/^ *"status": "\(.*\)"/\1/')" = "Complete" ]]; then
              repartix migrations complete
            fi
