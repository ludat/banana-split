services:
  backend:
    image:
      repository: ghcr.io/ludat/banana-split
      tag: 20261120-082233@sha256:f3a985d07c30280224414e65a1ba93fd821d9e8468cddcbbe39a12fd6cdc3209
      source:
        type: upstream
        stage: dev
    env:
      REPARTIX_DATABASE_URL:
        fromDependency: pg.uri

    port: 8000
    secrets:
      - config
    dependencies: [pg]
    routes:
      - host: stg.split.ludat.io

dependencies:
  pg:
    type: postgres

hooks:
  pre-deploy:
    - name: migrations
      service: backend
      command:
        - sh
        - -c
        - |
            timeout 10 repartix migrations init
            repartix migrations migrate ./migrations
  post-deploy:
    - name: migrations
      service: backend
      command:
        - sh
        - -c
        - |
            if ! [[ "$(timeout 10 repartix migrations status | grep status | sed 's/^ *"status": "\(.*\)"/\1/')" = "Complete" ]]; then
              repartix migrations complete
            fi
