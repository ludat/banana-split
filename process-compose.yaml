version: "0.5"

processes:
  backend: &backend
    command: |
      ghcid --command='cabal repl --enable-multi-repl exe:banana-split lib:banana-split' --reload=./config --run=Main.main --warnings
    environment:
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
    - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    - OTEL_SERVICE_NAME=backend
    - OTEL_RESOURCE_ATTRIBUTES=service.namespace=banana-split,service.version=latest,deployment.environment.name=local
    - OTEL_METRIC_EXPORT_INTERVAL=500
    - OTEL_BSP_SCHEDULE_DELAY=500
    - OTEL_BLRP_SCHEDULE_DELAY_MILLIS=500
    availability:
      restart: "always"
    depends_on:
      migrations:
        condition: process_completed_successfully
  tests:
    disabled: true
    command: |
      ghcid --command='cabal repl --enable-multi-repl test:spec lib:banana-split' --reload=./config --run=Main.main --warnings
    is_tty: true
  frontend:
    command: pnpm start
    # environment:
    # - LAUNCH_EDITOR=zeditor
    environment:
    - LAUNCH_EDITOR=idea
    - OTLP_ENDPOINT=http://localhost:4318
    working_dir: ./ui
    availability:
      restart: "always"
    readiness_probe:
      http_get:
        host: 127.0.0.1
        scheme: http
        path: "/"
        port: 1234
  migrations:
    command: |
      cabal run banana-split -- migrations init
      cabal run banana-split -- migrations rollback || true
      cabal run banana-split -- migrations migrate ./migrations
    availability:
      restart: on_failure
    depends_on:
      database:
        condition: process_healthy
  database:
    command: docker compose up database
    readiness_probe:
      exec:
        command: docker compose exec database pg_isready
    shutdown:
      command: docker compose down database
  observability:
    command: docker compose up observability
    readiness_probe:
      http_get:
        host: 127.0.0.1
        scheme: http
        path: "/ready"
        port: 13133
      initial_delay_seconds: 5
      period_seconds: 2
      failure_threshold: 30
    shutdown:
      command: docker compose stop observability
  mails:
    command: mailpit --enable-chaos
    readiness_probe:
      http_get:
        host: localhost
        scheme: http
        path: "/readyz"
        port: 8025
    availability:
      restart: "always"
