operations:
  - create_table:
      name: pago_netos
      constraints:
        - name: pago_netos__pago_participante
          type: primary_key
          columns:
            - pago__id
            - participante__id
      columns:
        - name: pago__id
          type: text
          nullable: false
          references:
            table: pagos
            column: id
            name: fk_pago_netos_pago__id
            on_delete: CASCADE
        - name: grupo__id
          type: text
          nullable: false
          references:
            table: grupos
            column: id
            name: fk_pago_netos_grupo__id
            on_delete: CASCADE
        - name: participante__id
          type: text
          nullable: false
          references:
            table: participantes
            column: id
            name: fk_pago_netos_participante__id
            on_delete: CASCADE
        - name: moneda
          type: text
          nullable: false
        - name: pagado_en_unidades_minimas
          type: bigint
          nullable: false
        - name: consumido_en_unidades_minimas
          type: bigint
          nullable: false

  - create_index:
      name: idx_pago_netos_grupo_participante
      table: pago_netos
      columns:
        grupo__id: {}
        participante__id: {}

  - create_index:
      name: idx_pago_netos_participante
      table: pago_netos
      columns:
        participante__id: {}

  - add_column:
      table: pagos
      up: "'{}'::jsonb"
      column:
        name: resumen
        type: jsonb
        nullable: false

  - drop_column:
      table: pagos
      column: is_valid
      down: "coalesce(resumen -> 'errores' = '[]'::jsonb, false)"
