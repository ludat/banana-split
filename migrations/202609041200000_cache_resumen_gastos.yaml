# Cache del resumen de cada gasto, para no tener que reconstruir las
# distribuciones de cada pago sólo para sumar netos.
#
# Son dos piezas que se escriben juntas y se leen distinto:
#
#  - 'pago_netos': una fila por gasto y participante, con lo que puso y lo que
#    consumió. Se suma con SUM() en SQL. Un gasto inválido no tiene filas.
#  - 'pagos.resumen': un jsonb con lo que no se puede sumar, sobre todo por qué
#    el gasto es inválido. '{}' = todavía sin calcular, '{"errores": []}' =
#    válido, errores no vacío = inválido con motivos.
#
# 'is_valid' se va en esta misma migración, no en una segunda después.
#
# El cache arranca frío: justo después de esto ningún gasto tiene filas en
# 'pago_netos' y todos tienen '{}'. Leer no calcula nada, así que hay que correr
# 'recompute-pagos' antes de servir tráfico; hasta entonces los gastos se ven
# como inválidos, no como sumando cero.
operations:
  - create_table:
      name: pago_netos
      constraints:
        # No tiene id propio: es una tabla derivada y la identidad de la fila es
        # de qué gasto y de qué participante habla. Así reemplazar el cache de
        # un gasto es idempotente.
        - name: pago_netos__pago_participante
          type: primary_key
          columns:
            - pago__id
            - participante__id
      columns:
        - name: pago__id
          type: text
          nullable: false
          references:
            table: pagos
            column: id
            name: fk_pago_netos_pago__id
            # Borrar un gasto se lleva su cache solo, sin tocar 'deletePago'.
            on_delete: CASCADE
        - name: participante__id
          type: text
          nullable: false
          references:
            table: participantes
            column: id
            name: fk_pago_netos_participante__id
        # Se repite igual que 'moneda': sin él, sumar los netos de un grupo
        # obliga a joinear 'pagos' sólo para filtrar, cuando la suma no necesita
        # nada más de esa tabla. Lo escribe el mismo 'savePago', así que no
        # puede desincronizarse.
        - name: grupo__id
          type: text
          nullable: false
          references:
            table: grupos
            column: id
            name: fk_pago_netos_grupo__id
            on_delete: CASCADE
        # La moneda se repite acá a propósito: sin ella la fila no se puede
        # interpretar (las unidades mínimas dependen de la moneda) y la
        # agregación necesitaría joinear con 'pagos'. No se puede desincronizar
        # porque se reescribe en el mismo 'savePago'.
        - name: moneda
          type: text
          nullable: false
        - name: pagado_en_unidades_minimas
          type: bigint
          nullable: false
        - name: consumido_en_unidades_minimas
          type: bigint
          nullable: false

  # La suma de los netos de un grupo, que es la consulta caliente.
  - create_index:
      name: idx_pago_netos_grupo_participante
      table: pago_netos
      columns:
        grupo__id: {}
        participante__id: {}

  # Para "cuánto puso y consumió este participante" cruzando grupos, donde el
  # índice de arriba no sirve porque no arranca por participante.
  - create_index:
      name: idx_pago_netos_participante
      table: pago_netos
      columns:
        participante__id: {}

  # La parte del resumen que no se puede sumar en SQL: los motivos de invalidez
  # y lo que la UI necesite saber del gasto sin que sea un número por
  # participante (cuánta gente reclamó en su repartija, por ejemplo).
  - add_column:
      table: pagos
      # Arranca en '{}' y no en NULL: no hay un estado "sin columna". '{}' es un
      # resumen del que no se puede leer ningún campo, o sea "todavía no lo
      # calculé", que es exactamente lo que pasa acá. Así la columna es NOT NULL
      # y el código no tiene que distinguir entre falta y es ilegible.
      #
      # No deriva de 'is_valid' a propósito: un gasto marcado válido tampoco
      # tiene todavía filas en 'pago_netos', así que copiar ese true diría que
      # cierra y sumaría cero. Todos arrancan sin calcular y 'recompute-pagos'
      # los llena.
      up: "'{}'::jsonb"
      column:
        name: resumen
        type: jsonb
        nullable: false

  - drop_column:
      table: pagos
      column: is_valid
      # El 'coalesce' es por el '{}': ahí 'resumen -> errores' es NULL y
      # 'jsonb_array_length' también, y la columna no acepta NULL. Un gasto sin
      # calcular vuelve como inválido, que es lo mismo que ve el binario nuevo.
      down: "coalesce(jsonb_array_length(resumen -> 'errores') = 0, false)"
