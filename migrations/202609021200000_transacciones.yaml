operations:
  # Las transacciones dejan de ser "las congeladas": una transacción marcada
  # como hecha sobrevive al descongelar y cuenta en los netos del grupo, así
  # que ya no son un detalle del congelamiento.
  - rename_table:
      from: transacciones_congeladas
      to: transacciones

  # NULL es pendiente. Las pendientes solo existen mientras el grupo está
  # congelado; las hechas quedan para siempre. Las que ya estaban guardadas
  # están todas pendientes.
  - add_column:
      table: transacciones
      column:
        name: saldada_at
        type: timestamptz
        nullable: true

  # Reemplaza a is_frozen: NULL es descongelado y la fecha dice cuándo se
  # congeló. Sirve para separar las transacciones hechas durante este
  # congelamiento (saldada_at > congelado_at) de las que arrastra de
  # congelamientos anteriores, que es lo que permite mostrar el neto original
  # al lado del residual. Para los grupos que ya están congelados no hay una
  # fecha real para poner, así que va la del deploy.
  - add_column:
      table: grupos
      up: "CASE WHEN is_frozen THEN now() ELSE NULL END"
      column:
        name: congelado_at
        type: timestamptz
        nullable: true

  - drop_column:
      table: grupos
      column: is_frozen
      down: "congelado_at IS NOT NULL"
